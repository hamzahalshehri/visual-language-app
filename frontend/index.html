<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة اللغة المرئية الإلكترونية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .logo-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }
    h2 {
      color: #2c3e50;
      font-weight: 700;
      font-size: 1.6rem;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: #7f8c8d;
      font-size: 0.95rem;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: right;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #34495e;
      font-weight: 500;
      font-size: 0.9rem;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e6ed;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }
    input:focus {
      border-color: #3498db;
      box-shadow: 0 0 8px rgba(52, 152, 219, 0.2);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
      margin-top: 10px;
    }
    button:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #2980b9, #1c5980);
    }
    .footer-text {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #95a5a6;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-icon">🗣️</div>
    <h2>منصة اللغة المرئية</h2>
    <p class="subtitle">بوابة الأخصائيين وأولياء أمور مرضى التوحد</p>

    <form id="loginForm">
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" placeholder="example@domain.com" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <button type="submit">تسجيل الدخول</button>
    </form>

    <div class="footer-text">
      جميع الحقوق محفوظة © منصة اللغة المرئية
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.querySelectorAll('input')[0].value;
      const password = document.querySelectorAll('input')[1].value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          // حفظ بيانات المستخدم في الجلسة المحلية
          localStorage.setItem('user', JSON.stringify(data.user));
          alert(`أهلاً بك يا ${data.user.name}! تم تسجيل الدخول بنجاح.`);
          window.location.href = 'dashboard.html';
        } else {
          alert(data.message || 'فشل تسجيل الدخول، تحقق من البيانات');
        }
      } catch (err) {
        alert('حدث خطأ في الاتصال بالسيرفر');
      }
    });
  </script>
</body>
</html>
