<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة اللغة المرئية - تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
    body { background: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .card { background: #ffffff; padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
    .logo-icon { font-size: 50px; margin-bottom: 10px; }
    h2 { color: #2c3e50; font-weight: 700; font-size: 1.6rem; margin-bottom: 8px; }
    p.subtitle { color: #7f8c8d; font-size: 0.95rem; margin-bottom: 25px; }
    .form-group { margin-bottom: 18px; text-align: right; }
    label { display: block; margin-bottom: 8px; color: #34495e; font-weight: 500; font-size: 0.9rem; }
    input { width: 100%; padding: 14px 16px; border: 2px solid #e0e6ed; border-radius: 12px; font-size: 0.95rem; outline: none; transition: 0.3s; }
    input:focus { border-color: #3498db; box-shadow: 0 0 8px rgba(52, 152, 219, 0.2); }
    button { width: 100%; padding: 14px; background: linear-gradient(135deg, #3498db, #2980b9); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .toast-success { display: none; background: #2ecc71; color: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; font-weight: 700; align-items: center; justify-content: center; gap: 10px; }
    .toast-error { display: none; background: #e74c3c; color: white; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo-icon">🗣️</div>
    <h2>منصة اللغة المرئية</h2>
    <p class="subtitle">بوابة المؤسسات والأخصائيين وأولياء الأمور</p>

    <div class="toast-success" id="toastSuccess">
      <span>✔️</span> <span id="toastText">تم تسجيل الدخول بنجاح</span>
    </div>
    <div class="toast-error" id="toastError"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>كود المؤسسة</label>
        <input type="text" id="orgCode" placeholder="أدخل كود المؤسسة (أو اتركه فارغاً للدخول المباشر)">
      </div>
      <div class="form-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="admin@example.com" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit">تسجيل الدخول</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const org_code = document.getElementById('orgCode').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const toastSuccess = document.getElementById('toastSuccess');
      const toastError = document.getElementById('toastError');
      toastError.style.display = 'none';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ org_code, email, password })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('user', JSON.stringify(data.user));
          document.getElementById('toastText').innerText = `أهلاً بك يا ${data.user.name}! تم تسجيل الدخول بنجاح.`;
          toastSuccess.style.display = 'flex';

          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
        } else {
          toastError.innerText = data.message;
          toastError.style.display = 'block';
        }
      } catch (err) {
        toastError.innerText = 'حدث خطأ في الاتصال بالسيرفر';
        toastError.style.display = 'block';
      }
    });
  </script>
</body>
</html>
